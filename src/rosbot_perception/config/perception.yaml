map_frame: map
# Omit camera_frame to use color image header.frame_id (matches Gazebo OpenNI + typical RealSense).
# rosbot_description uses camera_rgb_frame / camera_depth_frame, not camera_color_optical_frame.

color_topic: /camera/color/image_raw
depth_topic: /camera/depth/image_raw
camera_info_topic: /camera/color/camera_info

depth_scale: 0.001
min_depth_m: 0.10
max_depth_m: 4.00

min_contour_area: 450
depth_patch_radius_px: 2
publish_cooldown_sec: 0.40
min_publish_distance_m: 0.05
# Distributed setups (workstation + robot + camera over LAN) routinely
# accumulate ~200-500 ms of jitter between camera stamps and TF stamps
# even with NTP. 0.07 s was tight enough that perception dropped almost
# every projection until clocks were perfectly aligned. 0.30 s gives the
# TF buffer time to receive the stamp matching the image without
# noticeably degrading projection accuracy at the robot's <0.15 m/s
# motion budget.
tf_lookup_timeout_sec: 0.30
# Match-image-pairs slop: 0.08 s drops too many frames when the depth
# pipeline lags color slightly. 0.15 s aligns with realistic RGBD jitter.
sync_slop_sec: 0.15
# Optional: when TF lookup at the camera stamp fails by less than this
# many seconds, retry with the latest TF (Time(0)). Set to 0 to keep the
# strict "drop the projection" behaviour. Small values (<= 0.3 s) trade
# slightly stale extrinsics for actually getting puck/tag detections
# through during clock skew or slam_toolbox warm-up.
tf_fallback_max_skew_sec: 0.50
object_tf_publish_rate_hz: 12.0
object_tf_max_age_sec: 4.0
# Loud warning fires once per run when |camera_stamp - ros_now| exceeds
# this many seconds - that is real host clock drift, fix NTP/chrony.
clock_skew_warn_threshold_sec: 1.0

# Use full image while tuning ArUco/puck detection in the real arena.
crop_top_fraction: 0.00

hsv_ranges:
  red:
    - lower: [0, 110, 80]
      upper: [10, 255, 255]
    - lower: [170, 110, 80]
      upper: [180, 255, 255]
  green:
    - lower: [35, 80, 70]
      upper: [85, 255, 255]
  blue:
    - lower: [95, 80, 60]
      upper: [135, 255, 255]

aruco:
  dictionary: DICT_4X4_50
  marker_size_m: 0.25
  marker_color_map:
    "1": red
    "2": green
    "3": blue
