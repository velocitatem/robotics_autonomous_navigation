footprint: [[-0.11, -0.11], [-0.11, 0.11], [0.11, 0.11], [0.11, -0.11]]
robot_radius: 0.11

obstacle_layer:
  enabled: true
  obstacle_range: 2.5
  raytrace_range: 3.0
  max_obstacle_height: 1.0
  min_obstacle_height: 0.0
  combination_method: 1
  track_unknown_space: false
  observation_sources: scan
  # expected_update_rate: 0 disables the "Sensor data is out of date" gate in
  # move_base. With sim time and a slow real-time factor any positive value
  # causes spurious lockouts where the planner refuses to command the base.
  scan: {sensor_frame: laser, data_type: LaserScan, topic: scan, marking: true, clearing: true, expected_update_rate: 0.0, inf_is_valid: true}

inflation_layer:
  enabled: true
  cost_scaling_factor: 4.0
  inflation_radius: 0.18
