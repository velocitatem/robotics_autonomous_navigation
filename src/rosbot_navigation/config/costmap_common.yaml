footprint: [[-0.15, -0.15], [-0.15, 0.15], [0.15, 0.15], [0.15, -0.15]]
robot_radius: 0.15

obstacle_layer:
  enabled: true
  obstacle_range: 2.5
  raytrace_range: 3.0
  max_obstacle_height: 1.0
  min_obstacle_height: 0.0
  observation_sources: scan
  scan: {sensor_frame: laser, data_type: LaserScan, topic: scan, marking: true, clearing: true}

inflation_layer:
  enabled: true
  cost_scaling_factor: 10.0 # Steep scaling factor
  inflation_radius: 0.35    # Aggressive inflation to prevent wall touching
