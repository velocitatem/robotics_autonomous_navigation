local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 4.0
  publish_frequency: 3.0
  rolling_window: true
  width: 3.2
  height: 3.2
  resolution: 0.05
  # Slightly looser to tolerate PC↔robot clock/network jitter; fix NTP on both
  # hosts for the real solution (tighter tolerance is better when time sync is good).
  transform_tolerance: 3.5
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
