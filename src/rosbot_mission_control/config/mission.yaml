loop_hz: 2.0

map_frame: map
base_frame: base_link

target_order: [red, green, blue]
approach_distance_m: 0.30
dropoff_distance_m: 0.40
approach_goal_tolerance_m: 0.18
deliver_goal_tolerance_m: 0.20

navigation_timeout_sec: 45.0
pickup_retry_limit: 2
deliver_retry_limit: 3

servo_forward_speed: 0.10
servo_forward_time_sec: 1.2

backup_speed: 0.10
backup_distance_m: 0.10

exploration_mode: frontier_coverage
frontier_min_unknown_neighbors: 1
frontier_cluster_min_cells: 4
goal_clearance_cells: 2
explore_goal_timeout_sec: 18.0
explore_goal_tolerance_m: 0.20
explore_retry_limit: 2
active_scan_yaw_speed: 0.45
active_scan_duration_sec: 5.0
required_drop_zone_count: 3

init_spin_yaw_speed: 0.6
init_spin_duration_sec: 12.0
init_max_attempts: 4
init_nudge_distance_m: 0.4

bbox_occupied_threshold: 50
bbox_eps_m: 0.05
bbox_min_perimeter_cells: 60
bbox_min_free_cells: 40

tag_corner_snap_distance_m: 0.70
# Stand well inside the arena toward center so move_base/servo are not trying to
# park inside the corner pocket (oscillation / no plan with inflated walls).
corner_vantage_inset_m: 1.35
corner_vantage_center_fraction: 0.65
tag_vantage_wall_margin_m: 0.45
tag_tour_use_move_base: true
tag_tour_goal_timeout_sec: 45.0
tag_vantage_yaw_align_timeout_sec: 12.0
tag_vantage_yaw_tolerance_rad: 0.18
tag_dwell_sec: 1.5
puck_search_quadrant_inset_m: 0.50
locate_goal_timeout_sec: 25.0

servo_goal_linear_speed: 0.10
servo_goal_angular_gain: 1.4
servo_goal_max_angular: 0.8

visual_servo_speed: 0.05
visual_servo_grasp_distance_m: 0.18
visual_servo_timeout_sec: 12.0
visual_servo_align_tolerance_rad: 0.12
visual_servo_align_gain: 1.4
visual_servo_max_angular: 0.7
visual_servo_blocked_grace_sec: 1.5

front_stop_m: 0.26
rear_stop_m: 0.22
side_stop_m: 0.14
safety_sector_width_rad: 0.40
max_safe_linear_speed: 0.14
max_safe_angular_speed: 0.9
safe_goal_margin_m: 0.30
# Non-target pucks are below the lidar plane; we publish them to the costmap
# and gate cmd_vel. These tune how close the base may get to a *known* other
# puck (not the approach target, not the colour in the gripper).
goal_puck_clearance_m: 0.28
puck_stop_m: 0.32
puck_rotation_inner_m: 0.18
puck_rotation_outer_m: 0.40

move_base_wait_sec: 60.0
map_wait_sec: 30.0

known_object_stale_sec: 0.0
